name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build app
      - name: Lint (PEP8, docstrings)
        run: docker compose run --rm -T app ruff check .
      - name: Tests
        run: docker compose run --rm -T app pytest -q
