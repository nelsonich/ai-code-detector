paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  figures: reports/figures

sources:
  webdproc:
    dir: data/raw/webdproc
  progpedia:
    dir: data/raw/progpedia

preprocessing:
  min_code_chars: 50
  languages: [html, css, javascript, python, c, cpp, csharp, php, java]

features:
  comment_markers:
    javascript: ["//", "/*"]
    css: ["/*"]
    html: ["<!--"]
    python: ["#"]
    c: ["//", "/*"]
    cpp: ["//", "/*"]
    csharp: ["//", "/*"]
    php: ["//", "#", "/*"]
    java: ["//", "/*"]
