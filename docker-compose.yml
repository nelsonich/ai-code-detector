services:
  app:
    build: .
    image: ai-code-detector
    volumes:
      - .:/app
    command: ai-code-detector run

  notebook:
    image: ai-code-detector
    build: .
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
